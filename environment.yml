# Conda environment for the stereo SLAM pipeline.
#   conda env create -f environment.yml
#   conda activate slam
name: slam
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24,<2        # numpy 2.x breaks the gtsam / opencv ABI used here
  - matplotlib>=3.7
  - opencv>=4.8
  - pip
  - pip:
      - gtsam==4.2.1
      # Optional — only for the deep-learning front-end study (VAN_ex/code/dl_study/):
      # - torch==2.12.1
      # - kornia==0.8.3
      # - "lightglue @ git+https://github.com/cvg/LightGlue.git"
